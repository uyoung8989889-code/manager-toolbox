<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日早會管理個案學院｜媽咪樂 v2</title><style>:root{--pink:#b13e72;--coral:#ef8c7c;--bg:#fff9fb;--line:#f1dbe3;--ink:#33313a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,'Microsoft JhengHei',sans-serif}header{padding:36px 20px;background:linear-gradient(115deg,var(--pink),var(--coral));color:white}header div,main{max-width:880px;margin:auto}h1{margin:5px 0;font-size:30px}main{padding:22px 16px 70px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:23px;margin:16px 0;box-shadow:0 4px 16px #bd6e8410}.muted{color:#736c73}.tag{font-size:12px;background:#fff0f4;color:#97375e;padding:4px 10px;border-radius:99px}.btn{border:0;border-radius:11px;padding:11px 17px;background:var(--pink);color:white;cursor:pointer;font-size:15px}.outline{background:white;color:var(--pink);border:1px solid var(--pink)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.step{padding:13px;border:1px solid #e9dce1;border-radius:12px;text-align:center;background:#fcf8fa}.arrow{text-align:center;color:#bd8197}.step strong{display:block;font-size:17px;color:#34313a}.step small{display:block;font-size:15px;line-height:1.65;color:#554a52;margin-top:5px}.step em{display:block;font-size:14px;color:#943e64;font-style:normal;margin-top:7px;font-weight:600}.choices label,.audit label{display:block;margin:9px 0;padding:9px;border-radius:8px;background:#faf7f9;cursor:pointer}.good{background:#eaf7ef;padding:12px;border-radius:9px}.warn{background:#fff1ed;padding:12px;border-radius:9px}ol li{margin:12px 0}a{color:var(--pink)}footer{text-align:center;color:#82747c;font-size:13px;padding:25px}#lesson{display:none}@media(max-width:500px){h1{font-size:24px}.card{padding:17px}}</style></head><body><header><div><small>MOMMY HAPPY · COURSE PORTAL</small><h1>每日早會管理個案學院</h1><div>一天一個案例｜一張圖表｜問題123｜行動ABC｜三題稽核</div></div></header><main><section id="home"><h2>今日學習與歷史案例</h2><p class="muted">選擇案例，三分鐘學習，當天實作。</p><div id="cards"></div></section><section id="lesson"><button class="btn outline" onclick="goHome()">← 返回案例庫</button><div class="card"><span id="date" class="tag"></span><h2 id="title"></h2><p id="conclusion"></p></div><div class="card"><h2>一張圖表｜管理因果鏈（含說明與主管提問）</h2><div id="diagram"></div></div><div class="card"><h2>問題123｜看見管理盲點</h2><ol id="problems"></ol></div><div class="card"><h2>行動ABC｜主管下一步</h2><div id="actions"></div></div><div class="card"><h2>三題稽核｜今天做到了嗎？</h2><div id="audit" class="audit"></div><p id="progress" class="muted"></p></div><div class="card"><h2>管理判斷題</h2><p id="question"></p><div id="choices" class="choices"></div><button class="btn" onclick="grade()">提交答案</button><div id="result" style="margin-top:12px"></div></div><div class="card" id="learning"><h2>今日主管反思</h2><p id="reflection"></p><h2>管理證據與證明</h2><p id="evidence"></p><h2>延伸經理人學習</h2><p><strong id="book"></strong></p><p id="insight"></p><div id="reading-links" style="display:grid;gap:8px;margin-top:12px"></div><p class="muted" style="font-size:12px">延伸連結提供書籍介紹、文章或搜尋入口；部分文章可能需要訂閱。</p></div></section></main><footer>內部案例僅使用匿名化情境。勾選紀錄只保存在目前瀏覽器，不會上傳主管成績。</footer><script>const cases=[{id:'1112',date:'2026/11/12 · 案例002',title:'培養不出駐點經理，門市還能繼續擴張嗎？',conclusion:'區督導的價值，是培養能獨立經營的駐點經理，並帶動營運成長。',diagram:[['區督導培養儲備人才','有沒有儲備人選？是否有實際帶人與培訓進度？','目前誰能接班？'],['駐點經理具備獨立經營能力','能不能帶管家、留客戶、處理異常與經營業務？','誰已具備獨立經營能力？'],['管家、客戶、收入班次成長','人才成長是否帶動管家留任、新約與服務班次？','哪些數字證明成長？'],['驗證管理效益，決定發展或盤整','區分主管貢獻與公司資源投入，評估是否適合擴張。','持續發展還是重新盤整？']],problems:['人才培育為什麼停滯？','工具與資源增加，營運為何沒有成長？','若持續未改善，是否仍適合擴張？'],actions:['A｜今天：盤點儲備主管名單與能力差距。','B｜7天內：逐店找出管家、客戶、新約及收入班次變化原因。','C｜月底：驗收培育進度與營運數據，提出發展或盤整建議。'],audit:['我有儲備主管名單及培育進度。','我能提出各店營運數據變化。','我已訂定改善行動、責任人與期限。'],question:'培育一年仍無接班人才、收入班次下降，最合適的下一步是？',choices:['立即關閉績效最低門市','繼續等待，不設定期限','盤點能力與營運原因，訂定有期限的改善與整併評估條件'],correct:2,explain:'先釐清人才、制度、資源與市場因素，再以可驗收的行動決策。'},{id:'1111',date:'2026/11/11 · 案例001',title:'異常沒有及時管理，如何避免擴大為品牌風險？',conclusion:'主管的責任是及早辨識異常、跨部門合作、保留證據並守住服務品質。',diagram:[['發現異常與服務不穩','確認排班、服務與客戶回饋中的具體異常。','有沒有第一時間發現？'],['確認事實、保留紀錄','區分已證實事實、合法請假與尚待查證的資訊。','證據在哪裡？'],['駐點與人資協作處理','共同研擬合法、合理的服務調整與輔導方案。','誰負責協調？'],['客戶服務連續性與風險追蹤','安排替補、完成通知，追蹤客訴與未結事項。','30天後如何驗收？']],problems:['異常發生時，是否有客觀紀錄與回報？','駐點、人資與其他部門是否形成共同處理方案？','若未及時處理，客戶與團隊可能承受什麼影響？'],actions:['A｜今天：整理可確認的事實、時間軸與證據。','B｜7天內：跨部門確認合法、適當的支持與改善措施。','C｜30天內：追蹤服務中斷、重複客訴及未結案件。'],audit:['我已區分已證實事實與推測。','我已確認合法請假與不當行為不可混為一談。','我有跨部門處理紀錄與追蹤日期。'],question:'管家請假影響客戶排班，主管應優先採取哪個做法？',choices:['直接將合法請假視為違規','確認服務中斷事實、安排替補並依法協調','將個案公開給全體員工討論'],correct:1,explain:'合法請假應受保障；主管要管理的是服務安排、溝通及可證實的異常。'},{"id":"1113b","date":"2026/11/13 · 案例004","title":"駐點負責蒐證，總公司負責處理","conclusion":"駐點掌握事實與證據；總公司主動補件、依法處理並追蹤結案，讓駐點回到招募與客戶經營。","diagram":[["駐點發現異常","記錄日期、具體行為、影響及可查證的資料。","事實與證據在哪裡？"],["一案一專案","依駐點、管家與案件編號建立限制權限的追蹤紀錄。","目前由誰負責？"],["總公司接手補證","檢查證據缺口、指定補件責任人；必要時諮詢顧問或律師。","還缺哪些資料？"],["依法處理並追蹤","通知駐點配合事項，追蹤改善、處理結果與結案條件。","何時驗收與結案？"]],"problems":["駐點與總公司的處理責任是否清楚？","證據不足時，總公司是否主動要求補件？","異常案件是否有專案、負責人與進度？"],"actions":["A｜駐點：立即記錄客觀事實、保全證據並回報。","B｜總公司：檢查缺口、指定補件人與期限，審查合法處理方式。","C｜案件負責人：追蹤處理狀態、通知配合事項並確認結案。"],"audit":["每案有獨立案件編號、事實與佐證。","總公司已指定負責人、缺件清單與期限。","駐點已知配合事項，且案件有下次追蹤日。"],"question":"駐點已回報異常，但證據不足，最適當的下一步是？","choices":["讓駐點無限期自行處理","總公司主動列缺件、協調補證並依法評估","直接以異常紀錄作為解僱理由"],"correct":1,"explain":"蒐證與合法處理須分工；證據存在不等於當然符合解僱要件。"},{"id":"1113a","date":"2026/11/13 · 案例003","title":"管家介紹管家：數字是做出來的","conclusion":"利用管家願意分享的真實體驗促進招募，並以90天留任、到職人數與推薦成效驗證改善。","diagram":[["找到分享時機","早會提及入職約7～8天及晉升後，是可主動邀請分享的時機。","哪些管家願意真實分享？"],["提供推薦素材","駐點與人資合作LINE訊息，保留推薦來源，尊重個人意願。","素材是否能直接轉傳？"],["追蹤招募來源","記錄推薦、詢問、面談、到職及新人批次。","誰介紹、誰到職？"],["驗證90天成果","同批次比較90天內離職率、到職量與推薦到職數。","改變前後數字有改善嗎？"]],"problems":["是否已有方便管家轉傳的LINE推薦素材？","是否掌握合適的邀請時機與推薦來源？","只報當月離職數，是否缺少到職分母及90天追蹤？"],"actions":["A｜駐點與人資：製作一張真實、可自願轉傳的推薦素材。","B｜駐點：邀請願意分享的管家，記錄推薦來源與面談結果。","C｜人資：按到職批次追蹤90天內離職、招募量與推薦到職數。"],"audit":["已提供管家可自願轉傳的推薦素材。","已記錄推薦來源、面談與到職。","已建立同批次90天離職率比較，不以當月進離代替。"],"question":"10月到職15人、當月進離3人，能否證明90天留任改善？","choices":["可以，因為當月進離只有3人","不行，需等待同批次90天觀察並比較相同期間","可以，因為招募人數增加"],"correct":1,"explain":"早會口述7月12進3當月進離、8月4進1、9月4進1、10月15進3；當月進離不能取代90天留任率。"},{"id":"20260415a","date":"2026/04/15 · 歷史案例H001","title":"大坪數客戶要求低頻服務，能為了成交模糊規範嗎？","conclusion":"成交前要清楚說明服務範圍與頻率限制，不以隱瞞條件換取新約。","diagram":[["辨識需求","客戶提出大坪數空間與較低服務頻率的需求。","需求與公司規範是否相符？"],["說明限制","確認適用規範、工作量與服務可行性。","是否如實說明？"],["提出方案","依核准規範提出可履行的服務安排。","客戶理解差異嗎？"],["留下紀錄","將需求、說明與客戶選擇寫入接點紀錄。","後續是否可查證？"]],"problems":["是否為了成交忽略服務可行性？","客戶是否充分理解範圍與頻率？","接點紀錄是否能避免後續爭議？"],"actions":["A｜查核大坪數與服務頻率的現行規範。","B｜與客戶說明可履行方案及限制。","C｜保存溝通與合約確認紀錄。"],"audit":["已核對服務規範。","已向客戶說明限制及選擇。","已留下需求與合約確認紀錄。"],"question":"客戶提出可能不符服務規範的頻率，主管應如何處理？","choices":["先簽約再想辦法","如實說明規範並提出可履行方案","不留紀錄以維持彈性"],"correct":1,"explain":"以可履行承諾維持信任，不為短期新約隱瞞服務限制。"},{"id":"20260415b","date":"2026/04/15 · 歷史案例H002","title":"客戶臨時加工作，未完成原定項目，該免費回補嗎？","conclusion":"先釐清臨時加項、服務時間與事前溝通，不直接把所有落差歸咎管家。","diagram":[["確認原約定","核對客服卡、原定工作及時間。","原本要做什麼？"],["還原臨時變更","記錄客戶加項、實際時間與告知情況。","變更由誰提出？"],["判斷責任","區分工作疏漏、安排不足及期待落差。","是否有客觀依據？"],["改善與回覆","合理回覆客戶並修正下次服務安排。","怎麼避免重演？"]],"problems":["原定工作與臨時加項是否區分清楚？","管家有沒有即時說明時間限制？","主管是否在未查證前承諾免費回補？"],"actions":["A｜核對客服卡與服務過程紀錄。","B｜與客戶及管家確認變更和時間分配。","C｜決定合理補救並更新下次服務安排。"],"audit":["已核對原定工作內容。","已記錄臨時加項與溝通。","已說明處理依據並更新客服卡。"],"question":"客戶臨時要求增加工作導致原項目未完成，最適當做法？","choices":["直接認定管家失職","先查證加項及時間分配，再決定處理","一律免費回補"],"correct":1,"explain":"管理應先還原事實，避免因臨時需求造成不公平的責任歸屬。"},{"id":"20260527","date":"2026/05/27 · 歷史案例H003","title":"客戶先降頻再解約，駐點經理看見預警了嗎？","conclusion":"訂閱客戶減少服務頻率可能是留存預警，應先了解原因並調整服務價值。","diagram":[["發現頻率下降","原每週服務頻率降低或暫緩。","變化從何時開始？"],["辨識原因","區分預算、排班、品質、生活變化等因素。","是誰的原因？"],["提出改善","安排關懷、調整服務計畫或處理品質問題。","哪項行動可控制？"],["追蹤留存","比較降頻、續約與服務恢復情況。","改善是否有效？"]],"problems":["是否等客戶提出解約才開始關懷？","是否將降頻一律解讀為價格問題？","是否有降頻與續約的追蹤數據？"],"actions":["A｜整理近期降頻客戶與變動時間。","B｜主動訪談原因並提出合適改善。","C｜30天追蹤服務恢復與續約進展。"],"audit":["已辨識降頻客戶。","已記錄客戶原因與改善行動。","已設定追蹤日期及留存結果。"],"question":"客戶由每週兩次改為一次，主管最該先做什麼？","choices":["立即判定即將解約","確認原因、服務體驗與可調整方案","要求管家自行說服客戶"],"correct":1,"explain":"降頻是訊號不是定論，須區分需求、品質、排班與預算因素。"}];const learning={"1111":{"reflection":"我是否把異常歸咎於個人，卻忽略了流程、排班與跨部門合作？","evidence":"異常事實紀錄、服務通知與補班紀錄、案件追蹤日；比較未結案件及重複客訴。","book":"《清單革命》The Checklist Manifesto｜Atul Gawande","insight":"複雜工作需要清楚交接與關鍵檢核；把風險管理從個人記憶轉為可驗收流程。","links":[{"label":"Google Books｜搜尋《The Checklist Manifesto》","url":"https://books.google.com/books?q=The+Checklist+Manifesto+Atul+Gawande"}]},"1112":{"reflection":"我培養了多少能獨立經營的人，還是只增加自己管理的門市數？","evidence":"儲備名單、勝任驗收、管家與客戶數、收入班次；以相同期間比較成果。","book":"《領導梯隊》The Leadership Pipeline｜Ram Charan 等","insight":"主管的成果包括培養下一層領導者，而不只是個人完成多少工作。","links":[{"label":"Google Books｜搜尋《The Leadership Pipeline》","url":"https://books.google.com/books?q=The+Leadership+Pipeline+Ram+Charan"}]},"20260527":{"reflection":"客戶降低服務頻率時，我看見的是麻煩，還是提前改善的機會？","evidence":"降頻前後服務次數、原因分類、關懷紀錄、30天恢復情況與續約結果。","book":"《有效的管理者》The Effective Executive｜Peter F. Drucker","insight":"把注意力從忙碌轉向能影響客戶留存的具體成果。","links":[{"label":"出版社｜《有效的管理者》書籍介紹","url":"https://www.routledge.com/x/y/p/book/9780750685078"},{"label":"哈佛商業評論｜The Effective Decision","url":"https://hbr.org/1967/01/the-effective-decision"}]},"1113a":{"reflection":"當我一直說是管家的問題，是否忽略了自己可以改善的管理問題？","evidence":"每位新人從到職日起追蹤90天；未滿90天標示觀察中，不與已完成批次比較。另比較到職數、推薦到職數與90天離職率。","book":"《有效的管理者》The Effective Executive｜Peter F. Drucker","insight":"努力是過程，數據是檢驗，改善才是主管的價值。把時間投入能產生實際貢獻的工作。","links":[{"label":"出版社｜《有效的管理者》書籍介紹","url":"https://www.routledge.com/x/y/p/book/9780750685078"},{"label":"哈佛商業評論｜The Effective Decision","url":"https://hbr.org/1967/01/the-effective-decision"}]},"1113b":{"reflection":"我是否讓駐點一直處理異常，卻沒有讓總公司承接應負責的證據審查與後續決策？","evidence":"每案編號、事實與附件、缺件清單、總公司承辦人、補件期限、追蹤與結案紀錄。證據充分不等於當然可解僱，仍須依法審查。","book":"《清單革命》The Checklist Manifesto｜Atul Gawande","insight":"建立一案一專案與交接檢核，讓處理可追蹤，並把駐點時間還給招募與客戶經營。","links":[{"label":"Google Books｜搜尋《The Checklist Manifesto》","url":"https://books.google.com/books?q=The+Checklist+Manifesto+Atul+Gawande"}]},"20260415a":{"reflection":"我是否為了短期成交，留下長期無法履行的服務承諾？","evidence":"服務規範核對、需求與方案紀錄、合約確認；追蹤服務爭議與履約情形。","book":"《有效的管理者》The Effective Executive｜Peter F. Drucker","insight":"有效決策先釐清問題與限制，重視可持續的經營成果。","links":[{"label":"出版社｜《有效的管理者》書籍介紹","url":"https://www.routledge.com/x/y/p/book/9780750685078"},{"label":"哈佛商業評論｜The Effective Decision","url":"https://hbr.org/1967/01/the-effective-decision"}]},"20260415b":{"reflection":"我是否在還原事實之前，就急著判斷是管家的問題？","evidence":"客服卡、臨時加項紀錄、服務時間、客戶與管家雙方說明及後續回覆。","book":"《清單革命》The Checklist Manifesto｜Atul Gawande","insight":"標準化記錄與交接能減少誤判，讓每次服務變更都有依據。","links":[{"label":"Google Books｜搜尋《The Checklist Manifesto》","url":"https://books.google.com/books?q=The+Checklist+Manifesto+Atul+Gawande"}]}};let active=null;function goHome(){document.getElementById('lesson').style.display='none';document.getElementById('home').style.display='block';scrollTo(0,0)}function openCase(id){active=cases.find(c=>c.id===id);document.getElementById('home').style.display='none';document.getElementById('lesson').style.display='block';document.getElementById('date').textContent=active.date;document.getElementById('title').textContent=active.title;document.getElementById('conclusion').textContent=active.conclusion;document.getElementById('diagram').innerHTML=active.diagram.map((s,i)=>'<div class="step"><strong>'+(i+1)+'｜'+s[0]+'</strong><small>'+s[1]+'</small><em>主管提問：'+s[2]+'</em></div>'+(i<active.diagram.length-1?'<div class="arrow">↓</div>':'')).join('');document.getElementById('problems').innerHTML=active.problems.map(x=>'<li>'+x+'</li>').join('');document.getElementById('actions').innerHTML=active.actions.map(x=>'<p>'+x+'</p>').join('');document.getElementById('audit').innerHTML=active.audit.map((x,i)=>'<label><input type="checkbox" onchange="progress()" id="audit'+i+'"> '+x+'</label>').join('');document.getElementById('question').textContent=active.question;document.getElementById('choices').innerHTML=active.choices.map((x,i)=>'<label><input type="radio" name="choice" value="'+i+'"> '+String.fromCharCode(65+i)+'．'+x+'</label>').join('');document.getElementById('result').innerHTML='';const l=learning[active.id];document.getElementById('reflection').textContent=l.reflection;document.getElementById('evidence').textContent=l.evidence;document.getElementById('book').textContent=l.book;document.getElementById('insight').textContent=l.insight;document.getElementById('reading-links').innerHTML=l.links.map(x=>'<a href="'+x.url+'" target="_blank" rel="noopener noreferrer">📖 '+x.label+' ↗</a>').join('');progress();scrollTo(0,0)}function progress(){document.getElementById('progress').textContent='已完成 '+[0,1,2].filter(i=>document.getElementById('audit'+i)?.checked).length+' / 3 項自我檢視'}function grade(){const v=document.querySelector('input[name="choice"]:checked');document.getElementById('result').innerHTML=!v?'<div class="warn">請先選擇答案。</div>':'<div class="'+(+v.value===active.correct?'good':'warn')+'">'+(+v.value===active.correct?'答對了！':'再想想：')+' '+active.explain+'</div>'}document.getElementById('cards').innerHTML=cases.map(c=>'<div class="card"><span class="tag">'+c.date+'</span><h3>'+c.title+'</h3><p class="muted">'+c.conclusion+'</p><button class="btn" onclick="openCase(\''+c.id+'\')">開始學習 →</button></div>').join('');</script></body></html>
