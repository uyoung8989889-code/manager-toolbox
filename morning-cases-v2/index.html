<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日早會管理個案學院｜媽咪樂 v2</title><style>:root{--pink:#b13e72;--coral:#ef8c7c;--bg:#fff9fb;--line:#f1dbe3;--ink:#33313a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,'Microsoft JhengHei',sans-serif}header{padding:36px 20px;background:linear-gradient(115deg,var(--pink),var(--coral));color:white}header div,main{max-width:880px;margin:auto}h1{margin:5px 0;font-size:30px}main{padding:22px 16px 70px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:23px;margin:16px 0;box-shadow:0 4px 16px #bd6e8410}.muted{color:#736c73}.tag{font-size:12px;background:#fff0f4;color:#97375e;padding:4px 10px;border-radius:99px}.btn{border:0;border-radius:11px;padding:11px 17px;background:var(--pink);color:white;cursor:pointer;font-size:15px}.outline{background:white;color:var(--pink);border:1px solid var(--pink)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.step{padding:13px;border:1px solid #e9dce1;border-radius:12px;text-align:center;background:#fcf8fa}.arrow{text-align:center;color:#bd8197}.step strong{display:block;font-size:17px;color:#34313a}.step small{display:block;font-size:15px;line-height:1.65;color:#554a52;margin-top:5px}.step em{display:block;font-size:14px;color:#943e64;font-style:normal;margin-top:7px;font-weight:600}.choices label,.audit label{display:block;margin:9px 0;padding:9px;border-radius:8px;background:#faf7f9;cursor:pointer}.good{background:#eaf7ef;padding:12px;border-radius:9px}.warn{background:#fff1ed;padding:12px;border-radius:9px}ol li{margin:12px 0}a{color:var(--pink)}footer{text-align:center;color:#82747c;font-size:13px;padding:25px}#lesson{display:none}@media(max-width:500px){h1{font-size:24px}.card{padding:17px}}</style></head><body><header><div><small>MOMMY HAPPY · COURSE PORTAL</small><h1>每日早會管理個案學院</h1><div>一天一個案例｜一張圖表｜問題123｜行動ABC｜三題稽核</div></div></header><main><section id="home"><h2>今日學習與歷史案例</h2><p class="muted">選擇案例，三分鐘學習，當天實作。</p><div id="cards"></div></section><section id="lesson"><button class="btn outline" onclick="goHome()">← 返回案例庫</button><div class="card"><span id="date" class="tag"></span><h2 id="title"></h2><p id="conclusion"></p></div><div class="card"><h2>一張圖表｜管理因果鏈（含說明與主管提問）</h2><div id="diagram"></div></div><div class="card"><h2>問題123｜看見管理盲點</h2><ol id="problems"></ol></div><div class="card"><h2>行動ABC｜主管下一步</h2><div id="actions"></div></div><div class="card"><h2>三題稽核｜今天做到了嗎？</h2><div id="audit" class="audit"></div><p id="progress" class="muted"></p></div><div class="card"><h2>管理判斷題</h2><p id="question"></p><div id="choices" class="choices"></div><button class="btn" onclick="grade()">提交答案</button><div id="result" style="margin-top:12px"></div></div></section></main><footer>內部案例僅使用匿名化情境。勾選紀錄只保存在目前瀏覽器，不會上傳主管成績。</footer><script>const cases=[{id:'1112',date:'2026/11/12 · 案例002',title:'培養不出駐點經理，門市還能繼續擴張嗎？',conclusion:'區督導的價值，是培養能獨立經營的駐點經理，並帶動營運成長。',diagram:[['區督導培養儲備人才','有沒有儲備人選？是否有實際帶人與培訓進度？','目前誰能接班？'],['駐點經理具備獨立經營能力','能不能帶管家、留客戶、處理異常與經營業務？','誰已具備獨立經營能力？'],['管家、客戶、收入班次成長','人才成長是否帶動管家留任、新約與服務班次？','哪些數字證明成長？'],['驗證管理效益，決定發展或盤整','區分主管貢獻與公司資源投入，評估是否適合擴張。','持續發展還是重新盤整？']],problems:['人才培育為什麼停滯？','工具與資源增加，營運為何沒有成長？','若持續未改善，是否仍適合擴張？'],actions:['A｜今天：盤點儲備主管名單與能力差距。','B｜7天內：逐店找出管家、客戶、新約及收入班次變化原因。','C｜月底：驗收培育進度與營運數據，提出發展或盤整建議。'],audit:['我有儲備主管名單及培育進度。','我能提出各店營運數據變化。','我已訂定改善行動、責任人與期限。'],question:'培育一年仍無接班人才、收入班次下降，最合適的下一步是？',choices:['立即關閉績效最低門市','繼續等待，不設定期限','盤點能力與營運原因，訂定有期限的改善與整併評估條件'],correct:2,explain:'先釐清人才、制度、資源與市場因素，再以可驗收的行動決策。'},{id:'1111',date:'2026/11/11 · 案例001',title:'異常沒有及時管理，如何避免擴大為品牌風險？',conclusion:'主管的責任是及早辨識異常、跨部門合作、保留證據並守住服務品質。',diagram:[['發現異常與服務不穩','確認排班、服務與客戶回饋中的具體異常。','有沒有第一時間發現？'],['確認事實、保留紀錄','區分已證實事實、合法請假與尚待查證的資訊。','證據在哪裡？'],['駐點與人資協作處理','共同研擬合法、合理的服務調整與輔導方案。','誰負責協調？'],['客戶服務連續性與風險追蹤','安排替補、完成通知，追蹤客訴與未結事項。','30天後如何驗收？']],problems:['異常發生時，是否有客觀紀錄與回報？','駐點、人資與其他部門是否形成共同處理方案？','若未及時處理，客戶與團隊可能承受什麼影響？'],actions:['A｜今天：整理可確認的事實、時間軸與證據。','B｜7天內：跨部門確認合法、適當的支持與改善措施。','C｜30天內：追蹤服務中斷、重複客訴及未結案件。'],audit:['我已區分已證實事實與推測。','我已確認合法請假與不當行為不可混為一談。','我有跨部門處理紀錄與追蹤日期。'],question:'管家請假影響客戶排班，主管應優先採取哪個做法？',choices:['直接將合法請假視為違規','確認服務中斷事實、安排替補並依法協調','將個案公開給全體員工討論'],correct:1,explain:'合法請假應受保障；主管要管理的是服務安排、溝通及可證實的異常。'}];let active=null;function goHome(){document.getElementById('lesson').style.display='none';document.getElementById('home').style.display='block';scrollTo(0,0)}function openCase(id){active=cases.find(c=>c.id===id);document.getElementById('home').style.display='none';document.getElementById('lesson').style.display='block';document.getElementById('date').textContent=active.date;document.getElementById('title').textContent=active.title;document.getElementById('conclusion').textContent=active.conclusion;document.getElementById('diagram').innerHTML=active.diagram.map((s,i)=>'<div class="step"><strong>'+(i+1)+'｜'+s[0]+'</strong><small>'+s[1]+'</small><em>主管提問：'+s[2]+'</em></div>'+(i<active.diagram.length-1?'<div class="arrow">↓</div>':'')).join('');document.getElementById('problems').innerHTML=active.problems.map(x=>'<li>'+x+'</li>').join('');document.getElementById('actions').innerHTML=active.actions.map(x=>'<p>'+x+'</p>').join('');document.getElementById('audit').innerHTML=active.audit.map((x,i)=>'<label><input type="checkbox" onchange="progress()" id="audit'+i+'"> '+x+'</label>').join('');document.getElementById('question').textContent=active.question;document.getElementById('choices').innerHTML=active.choices.map((x,i)=>'<label><input type="radio" name="choice" value="'+i+'"> '+String.fromCharCode(65+i)+'．'+x+'</label>').join('');document.getElementById('result').innerHTML='';progress();scrollTo(0,0)}function progress(){document.getElementById('progress').textContent='已完成 '+[0,1,2].filter(i=>document.getElementById('audit'+i)?.checked).length+' / 3 項自我檢視'}function grade(){const v=document.querySelector('input[name="choice"]:checked');document.getElementById('result').innerHTML=!v?'<div class="warn">請先選擇答案。</div>':'<div class="'+(+v.value===active.correct?'good':'warn')+'">'+(+v.value===active.correct?'答對了！':'再想想：')+' '+active.explain+'</div>'}document.getElementById('cards').innerHTML=cases.map(c=>'<div class="card"><span class="tag">'+c.date+'</span><h3>'+c.title+'</h3><p class="muted">'+c.conclusion+'</p><button class="btn" onclick="openCase(\''+c.id+'\')">開始學習 →</button></div>').join('');</script></body></html>
